services:
  trading212-mcp:
    build:
      context: .
    image: trading212-mcp:local
    container_name: trading212-mcp
    restart: unless-stopped
    init: true
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8000}:8000"
    environment:
      T212_API_KEY: "${T212_API_KEY:?Set T212_API_KEY in .env}"
      T212_API_SECRET: "${T212_API_SECRET:?Set T212_API_SECRET in .env}"
      T212_ENV: "${T212_ENV:-demo}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*,trading212-mcp:*}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-http://127.0.0.1:*,http://localhost:*,http://[::1]:*}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

