name: Bug report
description: Report a reproducible problem using sanitized details.
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, use [private security reporting](https://github.com/Nerfagol/trading212-MCP/security/policy).
        Never include .env files, API keys, Authorization headers, tunnel credentials, certificates or private keys, or account, cash, portfolio, order, transaction or dividend values. Use synthetic examples and sanitized error messages.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: This report contains no credentials or private financial data.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the package version, image tag, or source commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: List the OS, deployment method, MCP client, and whether mTLS or snapshots are enabled. Omit private addresses, identifiers and paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic data. Do not make real financial API calls just to reproduce this report.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include only a sanitized error message if useful. Do not attach raw logs, configuration files, screenshots of accounts, or upstream responses.
    validations:
      required: true
