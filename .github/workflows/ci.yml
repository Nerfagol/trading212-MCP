name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install project and development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install -e '.[dev]' --no-deps --no-build-isolation
          python -m pip check

      - name: Audit locked dependencies
        run: |
          pip-audit --strict --disable-pip -r requirements.txt
          pip-audit --strict --disable-pip -r requirements-build.txt
          pip-audit --strict --disable-pip -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest

      - name: Build Python package
        run: python -m build --no-isolation

  docker:
    name: Docker image (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: python
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up ARM64 emulation
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          push: false
          load: true
          pull: true
          tags: trading212-mcp:ci
          cache-from: type=gha,scope=image-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.architecture }}

      - name: Block all high and critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          version: v0.76.1
          image-ref: trading212-mcp:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

      - name: Build private tunnel image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/qnap/tunnel/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          push: false
          load: true
          pull: true
          tags: trading212-tunnel:ci
          cache-from: type=gha,scope=tunnel-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=tunnel-${{ matrix.architecture }}

      - name: Block all high and critical tunnel vulnerabilities
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          version: v0.76.1
          image-ref: trading212-tunnel:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table
