services:
  tunnel-client:
    image: ghcr.io/openai/tunnel-client@sha256:a5b0b220577cdaeeb60a76d59700d03fb83ea8580c9c7871798ecadd09b4b71b
    container_name: openai-mcp-tunnel
    restart: unless-stopped
    init: true
    network_mode: host
    user: "10001:10001"
    command:
      - --control-plane.api-key=file:/run/secrets/control_plane_api_key
    environment:
      - CONTROL_PLANE_TUNNEL_ID=${CONTROL_PLANE_TUNNEL_ID:?Set CONTROL_PLANE_TUNNEL_ID in .env}
      - MCP_SERVER_URL=${MCP_SERVER_URL:?Set MCP_SERVER_URL in .env}
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - HEALTH_LISTEN_ADDR=127.0.0.1:18080
      - ALLOW_REMOTE_UI=false
    volumes:
      - ./secrets/control_plane_api_key:/run/secrets/control_plane_api_key:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /usr/bin/tunnel-client
        - health
        - --url=http://127.0.0.1:18080
        - --require-control-plane-poll
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
