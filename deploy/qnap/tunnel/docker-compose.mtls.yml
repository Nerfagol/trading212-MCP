services:
  tunnel-client:
    environment:
      MCP_SERVER_URL: https://${MCP_BIND_ADDRESS:?Set MCP_BIND_ADDRESS in the root .env}:${MCP_PORT:-8000}/mcp
      MCP_CLIENT_CERT: /run/mtls/tunnel.crt
      MCP_CLIENT_KEY: /run/mtls/tunnel.key
      CA_BUNDLE: /run/mtls/ca.crt
      MCP_STARTUP_WAIT_TIMEOUT: 30s
    volumes:
      - ../secrets/mtls/tunnel:/run/mtls:ro
