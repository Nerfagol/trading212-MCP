[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "trading212-mcp"
version = "0.2.0"
description = "Strictly read-only, self-hosted Trading 212 MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["trading212", "mcp", "model-context-protocol", "chatgpt", "portfolio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "httpx==0.28.1",
  "mcp==2.3.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "hatchling==1.33.0",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pip-tools==7.6.2",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
]

[project.scripts]
trading212-mcp = "trading212_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Nerfagol/trading212-MCP"
Source = "https://github.com/Nerfagol/trading212-MCP"
Issues = "https://github.com/Nerfagol/trading212-MCP/issues"
Security = "https://github.com/Nerfagol/trading212-MCP/security"

[tool.hatch.build.targets.wheel]
packages = ["src/trading212_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/data", "/logs", "/snapshots", "/AGENTS.md", "/project-tracker.skill*",
  "/docs/agent", "/docs/superpowers", "/.superpowers",
  "**/.env", "**/.env.*", "**/secrets", "/deploy/qnap/tunnel/state",
  "/deploy/qnap/storage.conf", "/deploy/qnap/mtls.enabled",
  "/.mtls-upgrade-*", "/.snapshots-upgrade-*", "**/*.before-runtime-security",
]

[tool.hatch.build.targets.sdist.force-include]
".env.example" = ".env.example"
"deploy/qnap/tunnel/.env.example" = "deploy/qnap/tunnel/.env.example"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".deps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trading212_mcp"]
mypy_path = "src"
